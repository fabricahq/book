name: Suggest an edit
description: Recommend a change to the book's content, such as a correction, a clearer explanation, or a better example
title: "Suggest an edit: "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the book. Describe the change you'd make, and I'll review it.
  - type: input
    id: page
    attributes:
      label: Page
      description: The page you'd change. The link at the bottom of each page fills this in.
      placeholder: https://fabricahq.com/book/...
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: Source file
      description: The page's file in this repository, filled in by the same link.
  - type: textarea
    id: passage
    attributes:
      label: Current text
      description: The passage you'd change, if it helps to quote it.
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: What it should say instead, or what's missing.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What's wrong or unclear today, and how your change helps.
